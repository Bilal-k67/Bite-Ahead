<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin Login | Bite Ahead</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="styles.css">
</head>

<body>

  <nav class="navbar navbar-expand site-nav">
    <div class="container">
      <a class="navbar-brand" href="LandingPage3.0.html">Bite Ahead</a>
      <ul class="navbar-nav ms-auto">
        <li class="nav-item"><a class="nav-link" href="index.html">Back to site</a></li>
      </ul>
    </div>
  </nav>

  <div class="auth-wrap">
    <div class="container">
      <div class="auth-card">
        <span class="auth-badge">Admin</span>
        <h1 class="h3 fw-bold mb-1">Log in</h1>
        <p class="text-secondary mb-4">Manage the menu, pickup slots, and today's queue.</p>

        <div class="auth-error" id="loginError">
          Incorrect email or password. Try again.
        </div>

        <form id="loginForm" novalidate>
          <div class="mb-3">
            <label class="form-label" for="email">Admin email</label>
            <input type="email" class="form-control" id="email" placeholder="admin@biteahead.edu" required>
          </div>
          <div class="mb-3">
            <label class="form-label" for="password">Password</label>
            <input type="password" class="form-control" id="password" placeholder="••••••••" required minlength="6">
          </div>
          <div class="form-check mb-4">
            <input class="form-check-input" type="checkbox" id="remember">
            <label class="form-check-label" for="remember">Keep me signed in</label>
          </div>
          <button type="submit" class="btn btn-yellow w-100">Log in</button>
        </form>

        <p class="text-center text-secondary small mt-4 mb-0">
          Not staff? <a href="register.html">Create a customer account</a> instead.
        </p>
      </div>
    </div>
  </div>

  <footer class="site-footer">
    <div class="container d-flex flex-wrap justify-content-between gap-2">
      <span><strong class="text-white">Bite Ahead</strong>, a university web development project</span>
      <span>This login is a front-end demo only — no real accounts are checked.</span>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>  
  
</body>
</html>
